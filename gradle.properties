# Momompurin Live Manager - Phase 1 Android build settings.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Android Gradle Plugin 8.7 requires JDK 17 or newer. The JDK on the
# system PATH here is 11 and cannot run it, so the build pins the JDK that
# ships with Android Studio. Override with -Dorg.gradle.java.home=... when
# building on another machine.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
